name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest so the runner keeps matching the
    # production server instead of drifting with GitHub's default.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 3.12 is what Ubuntu 24.04 ships, which is what the server runs. Test the
      # version we deploy on rather than a range we do not use.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Install the package itself, not just its dependencies, so `crumplib`
      # is importable no matter what directory pytest runs from. Editable so
      # the checked-out source is what gets tested.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -v

      - name: Verify the scripts run
        run: |
          ./crump --help
          ./geocode --help
          ./db_load --help
